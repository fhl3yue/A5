name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Public HTTPS app URL, for example https://your-domain.example/app/?client=android"
        required: true
        default: "https://your-domain.example/app/?client=android"

permissions:
  contents: read

jobs:
  build:
    name: Build WebView debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Configure cloud app URL
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import os
          import re
          import sys

          app_url = os.environ["APP_URL"].strip()
          if not app_url.startswith("https://"):
              sys.exit("app_url must start with https:// for Android WebView microphone and release compatibility.")

          path = Path("android-webview/app/src/main/res/values/strings.xml")
          text = path.read_text(encoding="utf-8")
          escaped_url = html.escape(app_url, quote=True)
          next_text, count = re.subn(
              r'(<string name="scenic_app_url">).*?(</string>)',
              lambda match: f"{match.group(1)}{escaped_url}{match.group(2)}",
              text,
              count=1,
          )
          if count != 1:
              sys.exit("scenic_app_url string resource was not found.")
          path.write_text(next_text, encoding="utf-8")
          print(f"Configured scenic_app_url={app_url}")
          PY

      - name: Build debug APK
        working-directory: android-webview
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenic-ai-guide-debug-apk
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
